<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Catalogue des commandes de chat du serveur Rust.">
  <title>Commandes Rust</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23110d1c'/%3E%3Cpath d='M15 18h34v8H15zm0 20h34v8H15z' fill='%23bda5ff'/%3E%3Cpath d='M19 30h26v5H19z' fill='%2354e0bd'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme: dark; --ink:#f4f0ff; --muted:#bdb4cf; --base:#0e0a17; --panel:#181126; --line:#302442; --purple:#bda5ff; --mint:#54e0bd; --danger:#f8a5b9; }
    * { box-sizing:border-box; } body { margin:0; min-width:320px; background:radial-gradient(circle at 88% -8%,#39265c 0,transparent 28rem),var(--base); color:var(--ink); font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { max-width:1180px; margin:auto; padding:3.5rem 1.25rem 4rem; } header { display:grid; grid-template-columns:1fr auto; gap:1.5rem; align-items:end; margin-bottom:2.5rem; } h1 { font-size:clamp(2.1rem,6vw,4.5rem); line-height:.95; margin:0; letter-spacing:-.06em; } .eyebrow { color:var(--mint); font-weight:750; text-transform:uppercase; letter-spacing:.13em; font-size:.75rem; margin:0 0 .7rem; } .intro { color:var(--muted); max-width:45rem; margin:1rem 0 0; } .count { color:var(--purple); font-weight:700; white-space:nowrap; }
    .controls { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:.75rem; margin-bottom:1rem; } input, select { appearance:none; border:1px solid var(--line); border-radius:.7rem; background:#120d1e; color:var(--ink); padding:.85rem 1rem; font:inherit; } input:focus, select:focus { outline:2px solid var(--mint); outline-offset:2px; } select { min-width:180px; } .hint { color:var(--muted); margin:.25rem 0 1.4rem; font-size:.875rem; }
    .list { display:grid; gap:.7rem; } article { display:grid; grid-template-columns:minmax(13rem,25%) minmax(9rem,16%) 1fr; gap:1rem; align-items:start; padding:1.15rem; background:linear-gradient(115deg,#1a1229,#151020); border:1px solid var(--line); border-radius:.85rem; } code { color:#171121; background:var(--purple); border-radius:.38rem; display:inline-block; font:700 .9rem/1.3 ui-monospace,SFMono-Regular,Consolas,monospace; padding:.26rem .44rem; overflow-wrap:anywhere; } .plugin { color:var(--mint); font-size:.9rem; font-weight:700; } .description { color:#dfd8ec; } .empty { padding:2rem; border:1px dashed var(--line); border-radius:.85rem; color:var(--muted); text-align:center; }
    footer { color:var(--muted); font-size:.82rem; margin-top:2rem; } @media(max-width:720px){ main{padding-top:2.3rem} header{grid-template-columns:1fr} .controls{grid-template-columns:1fr} select{min-width:0} article{grid-template-columns:1fr;gap:.45rem;padding:1rem} .plugin{margin-top:.2rem} }
  </style>
</head>
<body>
  <main>
    <header>
      <div><p class="eyebrow">Serveur Rust · plugins</p><h1>Commandes<br>de chat.</h1><p class="intro">Retrouve rapidement une commande, son plugin et son utilisation.</p></div>
      <div class="count" id="count">Chargement…</div>
    </header>
    <section aria-label="Recherche de commandes">
      <div class="controls"><input id="search" type="search" placeholder="Rechercher : shop, téléportation, /kit…" autocomplete="off" autofocus><select id="plugin" aria-label="Filtrer par plugin"><option value="">Tous les plugins</option></select></div>
      <p class="hint">La recherche examine la commande, le plugin et sa description.</p>
    </section>
    <section class="list" id="list" aria-live="polite"></section>
    <footer>Les commandes configurables peuvent avoir été renommées dans les fichiers de configuration du serveur.</footer>
  </main>
  <script>
    const list = document.querySelector('#list'), search = document.querySelector('#search'), plugin = document.querySelector('#plugin'), count = document.querySelector('#count');
    let commands = [];
    function render(){ const query=search.value.trim().toLocaleLowerCase('fr'); const selected=plugin.value; const found=commands.filter(x => (!selected||x.plugin===selected) && (!query || `${x.command} ${x.plugin} ${x.description}`.toLocaleLowerCase('fr').includes(query))); count.textContent=`${found.length} commande${found.length!==1?'s':''}`; list.replaceChildren(); if(!found.length){list.innerHTML='<div class="empty">Aucune commande ne correspond à cette recherche.</div>';return;} for(const item of found){const card=document.createElement('article'), cmd=document.createElement('code'), name=document.createElement('div'), desc=document.createElement('div');cmd.textContent=item.command;name.className='plugin';name.textContent=item.plugin;desc.className='description';desc.textContent=item.description;card.append(cmd,name,desc);list.append(card);} }
    fetch('./commands.json').then(r=>r.json()).then(data=>{commands=data.sort((a,b)=>a.command.localeCompare(b.command,'fr')); [...new Set(commands.map(x=>x.plugin))].sort((a,b)=>a.localeCompare(b,'fr')).forEach(name=>plugin.add(new Option(name,name))); render();}).catch(()=>{count.textContent='Erreur de chargement'; list.innerHTML='<div class="empty">La liste des commandes est indisponible.</div>';});
    search.addEventListener('input',render); plugin.addEventListener('change',render);
  </script>
</body>
</html>
